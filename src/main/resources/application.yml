# ============================================
# 銀行 API 平台配置檔案 - SQL Server 版本
# ============================================

spring:
  application:
    name: api-platform
  
  # SQL Server 2022 資料庫配置
  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    # 主資料庫連線（生產環境使用）
    url: jdbc:sqlserver://localhost:1433;databaseName=api_db;encrypt=true;trustServerCertificate=true;loginTimeout=30
    username: api_user
    password: Api@2024!
    
    # HikariCP 連線池配置
    hikari:
      pool-name: ApiHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      
      # SQL Server 特定優化
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
  
  # JPA 配置
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: none  # 不自動建立資料表，由 SQL 腳本管理
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        # SQL Server 特定配置
        dialect: org.hibernate.dialect.SQLServer2012Dialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false

# 伺服器配置
server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  # 生產環境安全配置
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

# Actuator 監控端點
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    metrics:
    export:
      prometheus:
        enabled: true

# Swagger API 文件
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

# 日誌配置
logging:
  level:
    root: INFO
    com.bank.apiplatform: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.microsoft.sqlserver: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/api-platform.log
    max-size: 10MB
    max-history: 30

# ============================================
# 多環境配置
# ============================================
---
# 開發環境
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=api_db_dev;encrypt=true;trustServerCertificate=true
  jpa:
    show-sql: true

---
# 測試環境
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:sqlserver://test-db-server:1433;databaseName=api_db_test;encrypt=true;trustServerCertificate=false
  jpa:
    show-sql: false

---
# 生產環境
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # 生產環境使用連線字串環境變數
    url: ${DB_CONNECTION_STRING}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 50
  jpa:
    show-sql: false
  logging:
    level:
      root: WARN
      com.bank.apiplatform: INFO